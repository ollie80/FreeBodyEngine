site_name: FreeBodyEngine
site_url: https://freebody.dev/
site_description: A Python game engine.
repo_url: https://github.com/ollie80/FreeBodyEngine
repo_name: ollie80/FreeBodyEngine
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: green
  font: false  # served ourselves in extra.css (FreeMono, not a Google Font)
  favicon: assets/favicon.png
  logo: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
            group_by_category: true
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: "#"

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - guide/scenes-and-nodes.md
      - guide/shaders.md
  - API Reference: reference/
