name: Docs

# Builds the docs on every push/PR, and deploys them to Cloudflare Pages on
# pushes to main. Replaces the Pi's freebody-docs-deploy.timer, which pulled
# origin/main and built the site on the home network.
#
# Two jobs on purpose: `build` runs the doc tooling (mkdocs plugins,
# scripts/gen_ref_pages.py, everything pinned in requirements-docs.txt) and
# never sees the Cloudflare token. `deploy` only downloads the finished
# site/ folder and uploads it - no third-party Python runs in the job that
# holds the token.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/gen_ref_pages.py"
      - "FreeBodyEngine/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/gen_ref_pages.py"
      - "FreeBodyEngine/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# One deploy at a time; a newer push supersedes an older one still running.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Verify no compromised doc-tooling packages
        # See requirements-docs.txt: properdocs/griffelib were compromised
        # around 2026-09-13. Second, independent gate on top of the pins.
        run: |
          if pip list --format=freeze | grep -iE "^(properdocs|griffelib)=="; then
            echo "::error::A compromised doc-tooling package is present - see requirements-docs.txt. Refusing to build."
            exit 1
          fi

      - name: Build site
        # No `pip install .` - mkdocstrings reads the engine's source
        # statically, so the engine's runtime dependencies aren't needed.
        run: mkdocs build --strict

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.134.0"
          command: pages deploy site --project-name=freebody-docs --branch=main
